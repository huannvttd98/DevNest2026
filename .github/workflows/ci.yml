name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Start disposable OpenSSH server for integration tests
        run: |
          ssh-keygen -q -t ed25519 -N devnest-pass -f "$RUNNER_TEMP/id_ed25519"
          docker run -d --name sshd -p 2222:2222 \
            -e PUID=1000 -e PGID=1000 -e USER_NAME=dev -e USER_PASSWORD=devpass \
            -e PASSWORD_ACCESS=true -e PUBLIC_KEY="$(cat $RUNNER_TEMP/id_ed25519.pub)" \
            lscr.io/linuxserver/openssh-server:latest
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/2222) 2>/dev/null && break; sleep 1; done
      - name: fmt
        working-directory: src-tauri
        run: cargo fmt --check
      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        working-directory: src-tauri
        env:
          DEVNEST_TEST_SSH_HOST: 127.0.0.1
          DEVNEST_TEST_SSH_PORT: 2222
          DEVNEST_TEST_SSH_USER: dev
          DEVNEST_TEST_SSH_PASSWORD: devpass
          DEVNEST_TEST_SSH_KEY: ${{ runner.temp }}/id_ed25519
          DEVNEST_TEST_SSH_KEY_PASSPHRASE: devnest-pass
        run: cargo test

  build:
    needs: [frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri build -- --debug
      - uses: actions/upload-artifact@v4
        with:
          name: devnest-${{ matrix.platform }}
          path: |
            src-tauri/target/debug/bundle/**/*.msi
            src-tauri/target/debug/bundle/**/*.exe
            src-tauri/target/debug/bundle/**/*.dmg
          if-no-files-found: ignore
